<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/login.css}" href="../../style/login.css" />

    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
</head>
<body class="login-page">
    <nav class="navbar navbar-inverse login-nav">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="/home">My Brick Plant<span th:if="${appEnv == 'dev'}" class="env-badge">DEV</span></a>
            </div>
        </div>
    </nav>

    <div class="container login-wrapper">
        <div class="row">
            <div class="col-xs-12 col-sm-8 col-sm-offset-2 col-md-5 col-md-offset-4">
                <div class="panel panel-default login-card">
                    <div class="panel-body">
                        <h2 class="login-title">Sign In</h2>
                        <p class="login-subtitle">Use your account to access My Brick Plant.</p>

                        <div class="alert alert-danger" role="alert" th:if="${param.error}">
                            Invalid username or password.
                        </div>
                        <div class="alert alert-success" role="alert" th:if="${param.logout}">
                            You have been logged out.
                        </div>

                        <form th:action="@{/login}" method="post" novalidate>
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    id="username"
                                    placeholder="Enter username"
                                    autocomplete="username"
                                    required
                                    autofocus />
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter password"
                                    autocomplete="current-password"
                                    required />
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </form>

                        <p class="text-center" style="margin-top: 15px;">
                            Don't have an account? <a th:href="@{/register}" href="/register">Register</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
