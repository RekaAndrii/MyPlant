<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - My Plant</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/login.css}" href="../../style/login.css" />

    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
</head>
<body class="login-page">
    <nav class="navbar navbar-inverse login-nav">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="/home">My Brick Plant</a>
            </div>
        </div>
    </nav>

    <div class="container login-wrapper">
        <div class="row">
            <div class="col-xs-12 col-sm-8 col-sm-offset-2 col-md-5 col-md-offset-4">
                <div class="panel panel-default login-card">
                    <div class="panel-body">
                        <h2 class="login-title">Create Account</h2>
                        <p class="login-subtitle">Register to access My Brick Plant.</p>

                        <!-- Single Error Alert Box -->
                        <div class="alert alert-danger" role="alert" th:if="${error}">
                            <span th:text="${error}"></span>
                        </div>

                        <!-- Success Message (from redirect) -->
                        <div class="alert alert-success" role="alert" th:if="${message}">
                            <span th:text="${message}"></span>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/register}" method="post" novalidate>
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    id="username"
                                    placeholder="Enter username"
                                    required
                                    autofocus
                                    th:value="${username}" />
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter email (example@domain.com)"
                                    required
                                    th:value="${email}" />
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter password (minimum 4 characters)"
                                    required />
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                        </form>

                        <hr />
                        <p class="text-center" style="margin-top: 15px; margin-bottom: 0;">
                            Already have an account? 
                            <a href="/login">Sign in here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
