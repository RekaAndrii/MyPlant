<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant - Suggestions</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
    <script th:src="@{/js/app.js}" src="../../js/app.js"></script>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('suggestions')}"></nav>

<div class="container page-content">

    <div class="row" th:if="${errorMessage}">
        <div class="col-xs-12">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <h3>App Suggestions</h3>
        </div>
    </div>

    <div class="row" style="margin-bottom: 24px;">
        <div class="col-xs-12">
            <div class="panel panel-default">
                <div class="panel-body">
                    <form th:action="@{/suggestions}" method="post">
                        <div class="form-group" style="margin-bottom: 10px;">
                            <textarea id="suggestionText" name="text" class="form-control"
                                      rows="3" placeholder="Describe your suggestion..."
                                      style="resize: vertical;"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Suggestion</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row" th:if="${suggestions == null or #lists.isEmpty(suggestions)}">
        <div class="col-xs-12">
            <p class="text-muted">No suggestions yet. Be the first to suggest an improvement!</p>
        </div>
    </div>

    <div class="row" th:if="${suggestions != null and not #lists.isEmpty(suggestions)}">
        <div class="col-xs-12">
            <div th:each="s : ${suggestions}" class="panel panel-default" style="margin-bottom: 10px;">
                <div class="panel-body">
                    <p style="margin-bottom: 6px; white-space: pre-wrap;" th:text="${s.text}"></p>
                    <small class="text-muted" th:text="${#temporals.format(s.createdDate, 'dd MMM yyyy, HH:mm')}"></small>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
