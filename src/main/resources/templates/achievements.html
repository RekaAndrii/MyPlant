<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant - Trophy</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <link rel="manifest" th:href="@{/manifest.json}" />
    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
    <script th:src="@{/js/app.js}" src="../../js/app.js"></script>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('achievements')}"></nav>

<div class="container page-content">
    <div class="row" th:if="${errorMessage}">
        <div class="col-xs-12">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <h3>Achievements</h3>
        </div>
    </div>

    <div class="row" th:if="${achievements == null or #lists.isEmpty(achievements)}">
        <div class="col-xs-12">
            <p class="text-muted">No achievements yet. Complete a challenge to see it here.</p>
        </div>
    </div>

    <div class="row" th:if="${achievements != null and not #lists.isEmpty(achievements)}">
        <div class="col-xs-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Goal</th>
                        <th>Target Executions</th>
                        <th>Date Achieved</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${achievements}">
                        <td th:text="${a.goalName}"></td>
                        <td th:text="${a.targetExecutions}"></td>
                        <td th:text="${a.achievedDate}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
