<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant - Trophy</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <link rel="manifest" th:href="@{/manifest.json}" />
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" id="navbarToggle"
                    onclick="document.getElementById('navbar').classList.toggle('in');">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/home">My Brick Plant<span th:if="${appEnv == 'dev'}" class="env-badge">DEV</span></a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav">
                <li><a href="/home">Home</a></li>
                <li><a href="/trend">Trends</a></li>
                <li class="active"><a href="/achievements">Trophy</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="navbar-form navbar-right">
                <button type="submit" class="btn btn-default">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="margin-top: 30px;">
    <div class="row" th:if="${errorMessage}">
        <div class="col-xs-12">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12">
            <h3>Achievements</h3>
        </div>
    </div>

    <div class="row" th:if="${achievements == null or #lists.isEmpty(achievements)}">
        <div class="col-xs-12">
            <p class="text-muted">No achievements yet. Complete a challenge to see it here.</p>
        </div>
    </div>

    <div class="row" th:if="${achievements != null and not #lists.isEmpty(achievements)}">
        <div class="col-xs-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Goal</th>
                        <th>Target Executions</th>
                        <th>Date Achieved</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${achievements}">
                        <td th:text="${a.goalName}"></td>
                        <td th:text="${a.targetExecutions}"></td>
                        <td th:text="${a.achievedDate}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
