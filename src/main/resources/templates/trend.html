<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant - Trends</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <link rel="stylesheet" th:href="@{/style/morris.css}" href="../../style/morris.css" />

    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
    <script th:src="@{/js/blocks.js}" src="../../js/blocks.js"></script>
    <script th:src="@{/js/raphael-min.js}" src="../../js/raphael-min.js"></script>
    <script th:src="@{/js/morris.js}" src="../../js/morris.js"></script>

    <style>
        .trend-panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .trend-panel .panel-heading {
            background: #333;
            border-bottom: 1px solid #444;
            border-radius: 6px 6px 0 0;
            padding: 10px 16px;
        }
        .trend-panel .panel-title {
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .trend-panel .panel-body {
            padding: 16px;
        }
        .chart-container {
            height: 260px;
            width: 100%;
        }
        .chart-container svg {
            width: 100% !important;
        }
        .chart-empty {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        /* Morris overrides for dark background */
        .morris-hover {
            background: #333 !important;
            border: 1px solid #555 !important;
            color: #ddd !important;
        }
        .morris-hover-row-label {
            color: #aaa !important;
        }
        @media (max-width: 767px) {
            .trend-row-top > div {
                width: 100%;
            }
        }
    </style>

    <script th:src="@{/js/trend.js}" src="../../js/trend.js"></script>
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" id="navbarToggle"
                    onclick="document.getElementById('navbar').classList.toggle('in');">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/home">My Brick Plant<span th:if="${appEnv == 'dev'}" class="env-badge">DEV</span></a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav">
                <li><a href="/home">Home</a></li>
                <li class="active"><a href="/trend">Trends</a></li>
                <li><a href="/achievements">Trophy</a></li>
                <li><a href="/suggestions">Suggestions</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="navbar-form navbar-right">
                <button type="submit" class="btn btn-default">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="margin-top: 24px;">

    <!-- Row 1: Weekday bar + Top blocks donut -->
    <div class="row trend-row-top">
        <div class="col-xs-12 col-sm-7">
            <div class="trend-panel">
                <div class="panel-heading">
                    <h3 class="panel-title">Executions per weekday</h3>
                </div>
                <div class="panel-body">
                    <div id="weekday-bar-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-5">
            <div class="trend-panel">
                <div class="panel-heading">
                    <h3 class="panel-title">Top habits this month</h3>
                </div>
                <div class="panel-body">
                    <div id="top-blocks-donut" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 2: 30-day activity line -->
    <div class="row">
        <div class="col-xs-12">
            <div class="trend-panel">
                <div class="panel-heading">
                    <h3 class="panel-title">Daily activity &mdash; last 30 days</h3>
                </div>
                <div class="panel-body">
                    <div id="daily-line-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
