<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <!--<link rel="stylesheet" th:href="@{/style/mdb.css}" href="../../style/mdb.css" />-->
    <link rel="manifest" th:href="@{/manifest.json}" />

    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
    <script th:src="@{/js/blocks.js}" src="../../js/blocks.js"></script>
    <script>
        (function () {
            var STALE_THRESHOLD_MS = 5 * 60 * 1000; // 5 minutes
            var hiddenAt = null;

            // iOS bfcache restore: page is served from frozen snapshot
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    window.location.reload();
                }
            });

            // Tab/app becomes hidden — record the time
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') {
                    hiddenAt = Date.now();
                } else if (document.visibilityState === 'visible' && hiddenAt !== null) {
                    if (Date.now() - hiddenAt >= STALE_THRESHOLD_MS) {
                        window.location.reload();
                    }
                    hiddenAt = null;
                }
            });
        })();
    </script>
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="/home">My Brick Plant</a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav">
                <li class="active"><a href="/home">Home</a></li>
                <li><a href="/trend">Trends</a></li>
                <li><a href="/achievements">Trophy</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="navbar-form navbar-right">
                <button type="submit" class="btn btn-default">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row" th:if="${errorMessage}">
        <div class="col-xs-12">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
        </div>
    </div>

    <div class="row" style="margin-bottom: 20px;">
        <div class="col-xs-12">
            <div class="input-group">
                <input id="newBlockName" type="text" class="form-control" placeholder="New block name" />
                <span class="input-group-btn">
                    <button id="addBlockBtn" class="btn btn-primary" type="button">Add block</button>
                </span>
            </div>
            <div style="margin-top: 8px;">
                <label style="font-weight: normal; cursor: pointer;">
                    <input id="isChallengeCheck" type="checkbox" style="margin-right: 6px;" />
                    This is a challenge
                </label>
                <div id="challengeOptions" style="display:none; margin-top: 6px;">
                    <input id="targetExecutions" type="number" min="1" class="form-control"
                           placeholder="Target executions (e.g. 30)" style="width: 240px;" />
                </div>
            </div>
        </div>
    </div>

    <div class="block-container col-xs-12">
        <div class="block-row col-xs-12 row">
            <div th:each="bl : ${blocks}" class="col-xs-4 block-col">
                <div class="block-item hoverable" th:classappend="${bl.color.value}">
                    <span  th:text="${bl.name}"></span>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
