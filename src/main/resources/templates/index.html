<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Plant</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" th:href="@{/style/bootstrap.css}" href="../../style/bootstrap.css" />
    <link rel="stylesheet" th:href="@{/style/blocks.css}" href="../../style/blocks.css" />
    <link rel="manifest" th:href="@{/manifest.json}" />

    <script th:src="@{/js/jquery-3.2.1.min.js}" src="../../js/jquery-3.2.1.min.js"></script>
    <script th:src="@{/js/app.js}" src="../../js/app.js"></script>
    <script th:src="@{/js/blocks.js}" src="../../js/blocks.js"></script>
    <script>
        (function () {
            var STALE_THRESHOLD_MS = 5 * 60 * 1000; // 5 minutes
            var hiddenAt = null;

            // iOS bfcache restore: page is served from frozen snapshot
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    window.location.reload();
                }
            });

            // Tab/app becomes hidden — record the time
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') {
                    hiddenAt = Date.now();
                } else if (document.visibilityState === 'visible' && hiddenAt !== null) {
                    if (Date.now() - hiddenAt >= STALE_THRESHOLD_MS) {
                        window.location.reload();
                    }
                    hiddenAt = null;
                }
            });
        })();
    </script>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('home')}"></nav>

<div class="container" style="padding-top: 0; margin-top: 0;">
    <div class="row" th:if="${errorMessage}">
        <div class="col-xs-12">
            <div class="alert alert-warning" th:text="${errorMessage}"></div>
        </div>
    </div>

    <div class="block-container col-xs-12">
        <div class="score-bar">
            <span class="score-label">Today's score: </span><span class="score-value" id="todayScore" th:text="${todayScore}">0</span>
        </div>
        <div class="block-row col-xs-12 row">
            <div th:each="bl : ${blocks}" class="col-xs-4 block-col">
                <div class="block-item hoverable" th:classappend="${bl.disabled} ? (${bl.color.value} + ' disabled-block') : ${bl.color.value}" th:attr="data-block-name=${bl.name},data-scheduled-days=${bl.scheduledDays != null} ? ${#strings.listJoin(bl.scheduledDays, ',')} : '',data-disabled=${bl.disabled}">
                    <div class="block-edit-icons" style="display:none;">
                        <button class="edit-disable-btn" type="button" th:if="${!bl.disabled}" title="Disable">&#9208;</button>
                        <button class="edit-disable-btn" type="button" th:if="${bl.disabled}" title="Enable">&#9654;</button>
                        <button class="edit-pencil-btn" type="button" title="Edit">&#9998;</button>
                        <button class="edit-trash-btn" type="button" title="Delete">&#128465;</button>
                    </div>
                    <div class="block-delete-confirm" style="display:none;">
                        <span>Delete?</span>
                        <button class="confirm-delete-yes btn btn-danger btn-sm" type="button">Yes</button>
                        <button class="confirm-delete-no btn btn-default btn-sm" type="button">No</button>
                    </div>
                    <span th:text="${bl.name}"></span>
                </div>
            </div>
            <div class="col-xs-4 block-col">
                <div id="addBlockBtn" class="block-item hoverable add-block-btn">
                    <span>+ Add block</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 text-center btn-bar">
            <button id="dayFilterBtn" class="edit-toggle-btn" type="button">Today only: Off</button>
            <button id="editModeBtn" class="edit-toggle-btn" type="button">Edit</button>
        </div>
    </div>

</div>

<!-- Add Block Modal -->
<div id="addBlockModal" class="add-block-modal-overlay" style="display:none;">
    <div class="add-block-modal-dialog">
        <h4 class="modal-title">New block</h4>
        <input id="newBlockName" type="text" class="form-control" placeholder="Block name" style="margin-bottom: 12px;" />
        <label style="font-weight: normal; cursor: pointer; font-size: 13px;">
            <input id="isChallengeCheck" type="checkbox" style="margin-right: 4px;" />
            This is a challenge
        </label>
        <div id="challengeOptions" style="display:none; margin-top: 8px; margin-bottom: 4px;">
            <input id="targetExecutions" type="number" min="1" class="form-control"
                   placeholder="Target executions (e.g. 30)" />
        </div>
        <div class="scheduled-days" style="margin-top: 12px;">
            <div class="scheduled-days-label">Scheduled days (leave empty for every day)</div>
            <div th:replace="~{fragments/day-checkboxes :: scheduledDays('addScheduledDays')}"></div>
        </div>
        <div style="margin-top: 16px;">
            <button id="submitBlockBtn" class="btn btn-primary" type="button">Add</button>
            <button id="cancelBlockBtn" class="btn btn-default" type="button" style="margin-left: 8px;">Cancel</button>
        </div>
    </div>
</div>

<!-- Edit Block Modal -->
<div id="editBlockModal" class="add-block-modal-overlay" style="display:none;">
    <div class="add-block-modal-dialog">
        <h4 class="modal-title">Edit block</h4>
        <input id="editBlockOriginalName" type="hidden" />
        <input id="editBlockName" type="text" class="form-control" placeholder="Block name" style="margin-bottom: 12px;" />
        <label style="font-weight: normal; cursor: pointer; font-size: 13px;">
            <input id="editIsChallengeCheck" type="checkbox" style="margin-right: 4px;" />
            This is a challenge
        </label>
        <div id="editChallengeOptions" style="display:none; margin-top: 8px; margin-bottom: 4px;">
            <input id="editTargetExecutions" type="number" min="1" class="form-control"
                   placeholder="Target executions (e.g. 30)" />
        </div>
        <div class="scheduled-days" style="margin-top: 12px;">
            <div class="scheduled-days-label">Scheduled days (leave empty for every day)</div>
            <div th:replace="~{fragments/day-checkboxes :: scheduledDays('editScheduledDays')}"></div>
        </div>
        <div style="margin-top: 16px;">
            <button id="saveEditBtn" class="btn btn-primary" type="button">Save</button>
            <button id="cancelEditBtn" class="btn btn-default" type="button" style="margin-left: 8px;">Cancel</button>
        </div>
    </div>
</div>

</body>
</html>
