<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Usage: <nav th:replace="~{fragments/navbar :: navbar('home')}"></nav>
    activePage values: 'home', 'trend', 'goals', 'suggestions'
-->
<nav th:fragment="navbar(activePage)" class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" id="navbarToggle">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/home">My Brick Plant<span th:if="${appEnv == 'dev'}" class="env-badge">DEV</span></a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav">
                <li th:classappend="${activePage == 'home'} ? 'active'"><a href="/home">Home</a></li>
                <li th:classappend="${activePage == 'trend'} ? 'active'"><a href="/trend">Trends</a></li>
                <li th:classappend="${activePage == 'goals'} ? 'active'"><a href="/goals">Goals</a></li>
                <li th:classappend="${activePage == 'suggestions'} ? 'active'"><a href="/suggestions">Suggestions</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="navbar-form navbar-right">
                <button type="submit" class="btn btn-default">Logout</button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
