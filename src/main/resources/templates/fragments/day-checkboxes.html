<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Usage:
      <div th:replace="~{fragments/day-checkboxes :: scheduledDays('addScheduledDays')}"></div>
-->
<div th:fragment="scheduledDays(containerId)" th:id="${containerId}" class="scheduled-days-row">
    <label class="day-checkbox"><input type="checkbox" data-day="1" /><span>Mon</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="2" /><span>Tue</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="3" /><span>Wed</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="4" /><span>Thu</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="5" /><span>Fri</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="6" /><span>Sat</span></label>
    <label class="day-checkbox"><input type="checkbox" data-day="7" /><span>Sun</span></label>
</div>

</body>
</html>
